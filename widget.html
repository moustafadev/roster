<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roster</title>
<style>
  :root {
    --bg: rgba(22, 22, 24, 0.97);
    --card: rgba(255, 255, 255, 0.045);
    --line: rgba(255, 255, 255, 0.09);
    --text: #f3f3f1;
    --dim: #9a9a96;
    --accent: #c8f24a;
    --warn: #ffb84a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body {
    font: 12px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: var(--text);
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  #root {
    width: 340px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 7px;
    padding: 10px 10px 9px 13px; cursor: grab;
  }
  header:active { cursor: grabbing; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .dot.off { background: #555; }
  h1 { font-size: 13px; font-weight: 700; letter-spacing: -0.1px; }
  .count { color: var(--dim); font-size: 12px; font-weight: 600; }
  .spacer { flex: 1; }
  button {
    all: unset; width: 22px; height: 22px; border-radius: 6px;
    display: grid; place-items: center; color: var(--dim); cursor: pointer;
  }
  button:hover { background: rgba(255, 255, 255, 0.1); color: var(--text); }
  button.on { color: var(--accent); }
  button svg { width: 13px; height: 13px; stroke: currentColor; fill: none;
               stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #list { padding: 0 8px 8px; display: flex; flex-direction: column; gap: 6px;
          max-height: 640px; overflow-y: auto; }
  #list::-webkit-scrollbar { width: 0; }
  .collapsed #list { display: none; }
  .empty { padding: 4px 6px 8px; color: var(--dim); }

  .group { display: flex; align-items: center; gap: 6px; padding: 4px 4px 0; color: var(--dim);
           font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
  .group i { flex: 1; height: 1px; background: var(--line); }

  .card {
    display: grid; grid-template-columns: 30px 1fr 22px; gap: 9px; align-items: start;
    padding: 8px 6px 8px 9px; background: var(--card);
    border: 1px solid transparent; border-radius: 10px; cursor: pointer;
  }
  .card:hover { background: rgba(255, 255, 255, 0.075); }
  .card.waiting { border-color: var(--accent); background: rgba(200, 242, 74, 0.08); }
  .card.stalled { border-color: rgba(255, 184, 74, 0.6); }
  .card.done .bot { opacity: 0.55; }
  .bot { width: 30px; height: 32px; margin-top: 2px; }
  .body { min-width: 0; }
  .top { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .project {
    flex: none; max-width: 130px; padding: 1px 7px; border-radius: 999px;
    font-size: 10.5px; font-weight: 700; color: #111;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .branch { flex: 1; min-width: 0; color: var(--dim); font-size: 10.5px; font-weight: 600; }
  .title { font-weight: 650; font-size: 12.5px; margin-top: 3px; }
  .branch, .title, .activity, .step { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .activity { color: var(--dim); font-size: 11px; margin-top: 1px; }
  .waiting .activity { color: var(--accent); font-weight: 650; }
  .stalled .activity { color: var(--warn); font-weight: 650; }
  .stats { color: var(--dim); font-size: 10.5px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .stats b { font-weight: 600; color: #c9c9c4; }
  .stats .plus { color: #7bd35a; } .stats .minus { color: #ff7a66; }
  .progress { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 10.5px; }
  .num { color: var(--accent); font-weight: 800; flex: none; }
  .step { color: var(--text); font-weight: 600; flex: none; max-width: 120px; }
  .bar { flex: 1; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s; }
  .bar.busy i { width: 35%; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  .side { display: flex; flex-direction: column; gap: 1px; }
  .side button { width: 20px; height: 20px; }
  .side button svg { width: 11px; height: 11px; }

  .ask, .reply { grid-column: 1 / -1; margin-top: 2px; }
  .cmd {
    font: 10.5px/1.4 ui-monospace, "SF Mono", Menlo, monospace; color: #d9d9d4;
    background: rgba(0, 0, 0, 0.35); border-radius: 6px; padding: 5px 7px;
    max-height: 46px; overflow: hidden; word-break: break-all;
  }
  .answers { display: flex; gap: 6px; margin-top: 6px; }
  .answers button {
    flex: 1; width: auto; height: 24px; border-radius: 7px; font-size: 11.5px; font-weight: 700;
    color: var(--text); background: rgba(255, 255, 255, 0.1);
  }
  .answers button:hover { background: rgba(255, 255, 255, 0.18); }
  .answers button.allow { background: var(--accent); color: #111; }
  .answers button.allow:hover { background: #d8ff66; color: #111; }
  .reply { display: flex; gap: 6px; }
  .reply input {
    all: unset; flex: 1; min-width: 0; height: 24px; padding: 0 8px; border-radius: 7px;
    background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); font-size: 11.5px;
    -webkit-user-select: text; user-select: text; cursor: text;
  }
  .reply input:focus { border-color: var(--accent); }
  .reply input::placeholder { color: #6f6f6b; }
  .reply button { width: 44px; height: 26px; border-radius: 7px; font-size: 11px; font-weight: 700;
                  background: rgba(255, 255, 255, 0.1); color: var(--text); }

  .hrow { display: grid; grid-template-columns: 36px 1fr auto; gap: 8px; align-items: center;
          padding: 6px 8px; background: var(--card); border-radius: 8px; }
  .hrow .time { color: var(--dim); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .hrow .what { min-width: 0; }
  .hrow .right { color: var(--dim); font-size: 10.5px; text-align: right; font-variant-numeric: tabular-nums; }
  .hrow .title { margin-top: 2px; font-size: 11.5px; }
  .total { padding: 2px 6px 4px; color: var(--dim); font-size: 10.5px; }
</style>
</head>
<body>
<div id="root">
  <header id="header">
    <span class="dot" id="dot"></span>
    <h1 id="heading">Roster</h1>
    <span class="count" id="count">0</span>
    <span class="spacer"></span>
    <button id="history" title="Today's finished work"></button>
    <button id="mute" title="Sound on/off"></button>
    <button id="fold" title="Collapse"></button>
    <button id="hide" title="Hide (bring it back from the menu bar icon, or Ctrl+Option+H)"><svg viewBox="0 0 14 14"><path d="M3 3l8 8M11 3l-8 8"/></svg></button>
  </header>
  <div id="list"></div>
</div>

<script>
(function () {
  var COLORS = ["#5b8cff", "#ff6fae", "#ffa13d", "#9b7bff", "#3fd6c0", "#f2d14a", "#ff7a66", "#7bd35a"];
  // Each project gets its own "needs you" chime (built-in macOS sounds).
  var ASK_SOUNDS = ["Glass", "Ping", "Hero", "Submarine", "Purr", "Blow", "Bottle", "Frog"];
  var STALL_SECONDS = 300;
  var ICON = {
    soundOn: '<svg viewBox="0 0 14 14"><path d="M2 5.5h2l3-2.5v8l-3-2.5H2z"/><path d="M9.5 5a3 3 0 010 4M11 3.5a5 5 0 010 7"/></svg>',
    soundOff: '<svg viewBox="0 0 14 14"><path d="M2 5.5h2l3-2.5v8l-3-2.5H2z"/><path d="M9.5 5.5l3 3M12.5 5.5l-3 3"/></svg>',
    up: '<svg viewBox="0 0 14 14"><path d="M3 9l4-4 4 4"/></svg>',
    down: '<svg viewBox="0 0 14 14"><path d="M3 5l4 4 4-4"/></svg>',
    open: '<svg viewBox="0 0 14 14"><path d="M5.5 3H3v8h8V8.5M8 3h3v3M11 3L6.5 7.5"/></svg>',
    close: '<svg viewBox="0 0 14 14"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7"/></svg>',
    reply: '<svg viewBox="0 0 14 14"><path d="M2.5 3.5h9v6h-5l-2.5 2v-2h-1.5z"/></svg>',
    clock: '<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="4.8"/><path d="M7 4.5V7l1.8 1.2"/></svg>'
  };

  var root = document.getElementById("root");
  var list = document.getElementById("list");
  var demo = location.search.indexOf("demo") >= 0;
  var muted = false, collapsed = false, showHistory = location.search.indexOf("history") >= 0;
  var lastStatus = {}, lastSignature = "", lastHeight = 0, firstRender = true;
  var answered = {}, stallChimed = {}, lastSessions = [], history = [];
  var replyOpen = {}, replyDraft = {}, replyFocus = "";

  try { muted = localStorage.getItem("huddleMuted") === "1"; } catch (e) {}

  function post(message) {
    try { window.webkit.messageHandlers.huddle.postMessage(message); } catch (e) {}
  }
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function hash(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return h;
  }
  function colorFor(name) { return COLORS[hash(name) % COLORS.length]; }
  function nowSeconds() { return Date.now() / 1000; }
  function duration(seconds) {
    seconds = Math.max(0, Math.floor(seconds || 0));
    if (seconds < 60) return "<1m";
    if (seconds < 3600) return Math.floor(seconds / 60) + "m";
    return Math.floor(seconds / 3600) + "h " + Math.floor((seconds % 3600) / 60) + "m";
  }
  function compact(n) {
    n = n || 0;
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1e3) return Math.round(n / 1e3) + "k";
    return String(n);
  }
  function money(n) { return "~$" + (n >= 10 ? n.toFixed(0) : n.toFixed(2)); }
  function clock(t) {
    var d = new Date(t * 1000);
    return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }

  function bot(color, status) {
    var eyes = status === "done"
      ? '<path d="M9.5 13.5h3M17.5 13.5h3" stroke="#111" stroke-width="2" stroke-linecap="round"/>'
      : '<rect x="9.5" y="11" width="3" height="5" rx="1.5" fill="#111"/><rect x="17.5" y="11" width="3" height="5" rx="1.5" fill="#111"/>';
    var wrap = el("div", "bot");
    wrap.innerHTML =
      '<svg viewBox="0 0 30 32" width="30" height="32">' +
      '<path d="M15 1.5v4" stroke="' + color + '" stroke-width="2" stroke-linecap="round"/>' +
      '<circle cx="15" cy="2" r="1.8" fill="' + color + '"/>' +
      '<rect x="4" y="5" width="22" height="19" rx="6" fill="' + color + '"/>' +
      '<rect x="8" y="23" width="4" height="7" rx="2" fill="' + color + '"/>' +
      '<rect x="18" y="23" width="4" height="7" rx="2" fill="' + color + '"/>' +
      eyes + '</svg>';
    return wrap;
  }
  function iconButton(icon, title, handler) {
    var b = el("button");
    b.innerHTML = icon; b.title = title;
    b.addEventListener("click", function (e) { e.stopPropagation(); handler(); });
    return b;
  }
  function pill(project) {
    var p = el("span", "project", project);
    p.style.background = colorFor(project);
    return p;
  }
  function rerender() { lastSignature = ""; window.huddleRender(lastSessions.concat(historyPacket())); }
  function historyPacket() { return history.length ? [{ kind: "history", items: history }] : []; }

  // A request is live while its hook is still waiting (it heartbeats every second).
  function livePending(s) {
    var p = s.pending;
    if (!p || !p.id || answered[p.id]) return false;
    return demo || (nowSeconds() - (p.beat || 0)) < 4;
  }
  function stalledFor(s) {
    if (s.status !== "working" || demo && !s.demoStall) return 0;
    var quiet = demo ? s.demoStall : nowSeconds() - (s.updated || nowSeconds());
    return quiet > STALL_SECONDS ? quiet : 0;
  }
  function timeText(s) {
    if (demo) return s.demoTime || "";
    if (s.status === "working") return s.turn_started ? duration(nowSeconds() - s.turn_started) : "";
    if (s.status === "waiting") return "waiting " + duration(nowSeconds() - (s.since || nowSeconds()));
    if (s.status === "done") return "done " + duration(nowSeconds() - (s.since || nowSeconds())) + " ago";
    return "";
  }
  function activityText(s) {
    var quiet = stalledFor(s);
    if (quiet) return "Quiet for " + duration(quiet) + " · " + (s.activity || "");
    if (s.queued) return "Reply queued · " + (s.activity || "");
    return s.activity || "";
  }

  function statsLine(s) {
    var line = el("div", "stats");
    var parts = [];
    var t = timeText(s);
    if (t) parts.push(el("b", "", t));
    var tok = s.tokens || [0, 0, 0, 0];
    var totalTok = tok[0] + tok[1] + tok[2] + tok[3];
    if (totalTok) {
      var tk = el("span", "", compact(totalTok) + " tok");
      tk.title = "input " + compact(tok[0]) + " · output " + compact(tok[1]) +
                 " · cache write " + compact(tok[2]) + " · cache read " + compact(tok[3]);
      parts.push(tk);
    }
    if (s.cost) {
      var c = el("span", "", money(s.cost));
      c.title = "Estimate at API list prices";
      parts.push(c);
    }
    if (s.files_n) {
      var f = el("span");
      f.appendChild(el("span", "", s.files_n + (s.files_n === 1 ? " file " : " files ")));
      f.appendChild(el("span", "plus", "+" + (s.added || 0)));
      f.appendChild(document.createTextNode(" "));
      f.appendChild(el("span", "minus", "−" + (s.removed || 0)));
      parts.push(f);
    }
    parts.forEach(function (p, i) {
      if (i) line.appendChild(document.createTextNode(" · "));
      line.appendChild(p);
    });
    return parts.length ? line : null;
  }

  function send(s, input) {
    var text = (input.value || "").trim();
    if (!text) return;
    post({ type: "reply", id: s.session_id, text: text });
    if (s.pending) answered[s.pending.id] = true;
    replyDraft[s.session_id] = ""; replyOpen[s.session_id] = false; replyFocus = "";
    rerender();
  }

  function card(s) {
    var status = s.status || "idle";
    var project = s.project || "unknown";
    var color = colorFor(project);
    var stalled = stalledFor(s);
    var node = el("div", "card " + status + (stalled ? " stalled" : ""));
    node.title = (s.project_dir || s.cwd || "") + "\nClick to jump to this session";
    node.addEventListener("click", function () { post({ type: "focus", id: s.session_id }); });

    node.appendChild(bot(color, status));

    var body = el("div", "body");
    var top = el("div", "top");
    top.appendChild(pill(project));
    if (s.branch) {
      var br = el("span", "branch", "⎇ " + s.branch);
      br.title = s.branch;
      top.appendChild(br);
    }
    body.appendChild(top);
    body.appendChild(el("div", "title", s.title || "New session"));
    body.appendChild(el("div", "activity", activityText(s)));
    var stats = statsLine(s);
    if (stats) body.appendChild(stats);

    var total = s.total || 0, done = s.done || 0;
    var progress = el("div", "progress");
    if (total > 0) {
      progress.appendChild(el("span", "num", done + "/" + total));
      if (s.current) progress.appendChild(el("span", "step", s.current));
      var bar = el("div", "bar"), fill = el("i");
      fill.style.width = Math.round(100 * done / total) + "%";
      bar.appendChild(fill); progress.appendChild(bar);
    } else {
      var label = { working: "Working", waiting: "Needs you", done: "Done", idle: "Idle" }[status] || status;
      progress.appendChild(el("span", "num", label));
      var bar2 = el("div", "bar" + (status === "working" && !stalled ? " busy" : ""));
      var fill2 = el("i");
      if (status === "done") fill2.style.width = "100%";
      else if (status !== "working" || stalled) fill2.style.width = "0%";
      bar2.appendChild(fill2); progress.appendChild(bar2);
    }
    body.appendChild(progress);
    node.appendChild(body);

    var side = el("div", "side");
    side.appendChild(iconButton(ICON.open, "Jump to session", function () { post({ type: "focus", id: s.session_id }); }));
    side.appendChild(iconButton(ICON.reply, "Quick reply", function () {
      replyOpen[s.session_id] = !replyOpen[s.session_id];
      replyFocus = replyOpen[s.session_id] ? s.session_id : "";
      rerender();
    }));
    side.appendChild(iconButton(ICON.close, "Close session", function () { post({ type: "close", id: s.session_id }); }));
    node.appendChild(side);

    // Permission request that can be answered right here.
    var pending = livePending(s);
    if (pending) {
      var ask = el("div", "ask");
      var cmd = el("div", "cmd", s.pending.detail || s.pending.summary || s.pending.tool || "");
      cmd.title = s.pending.detail || "";
      ask.appendChild(cmd);
      var answers = el("div", "answers");
      var choices = [["allow", "Allow", "Allow once (Ctrl+Option+A)"]];
      if (s.pending.can_always) choices.push(["always", "Always", "Allow, and stop asking for commands like this"]);
      choices.push(["deny", "Deny", "Refuse this"]);
      choices.forEach(function (c) {
        var b = el("button", c[0], c[1]);
        b.title = c[2];
        b.addEventListener("click", function (e) {
          e.stopPropagation();
          answered[s.pending.id] = true;
          post({ type: c[0], id: s.session_id });
          rerender();
        });
        answers.appendChild(b);
      });
      ask.appendChild(answers);
      node.appendChild(ask);
    }

    if (replyOpen[s.session_id]) {
      var row = el("div", "reply");
      var input = el("input");
      input.type = "text";
      input.placeholder = pending ? "Tell Claude what to do instead…"
        : status === "working" ? "Message — delivered at its next step…" : "Reply to this session…";
      input.value = replyDraft[s.session_id] || "";
      input.addEventListener("click", function (e) { e.stopPropagation(); });
      input.addEventListener("input", function () { replyDraft[s.session_id] = input.value; });
      input.addEventListener("focus", function () { replyFocus = s.session_id; });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); send(s, input); }
        if (e.key === "Escape") { replyOpen[s.session_id] = false; replyFocus = ""; rerender(); }
      });
      var go = el("button", "", "Send");
      go.addEventListener("click", function (e) { e.stopPropagation(); send(s, input); });
      row.appendChild(input); row.appendChild(go);
      row.addEventListener("click", function (e) { e.stopPropagation(); });
      node.appendChild(row);
      if (replyFocus === s.session_id) {
        setTimeout(function () { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }, 0);
      }
    }
    return node;
  }

  function historyRow(h) {
    var row = el("div", "hrow");
    row.appendChild(el("span", "time", clock(h.t)));
    var what = el("div", "what");
    var top = el("div", "top");
    top.appendChild(pill(h.project || "unknown"));
    if (h.branch) top.appendChild(el("span", "branch", "⎇ " + h.branch));
    what.appendChild(top);
    what.appendChild(el("div", "title", h.title || "(no prompt)"));
    row.appendChild(what);
    var right = el("div", "right");
    right.appendChild(el("div", "", duration(h.secs)));
    if (h.files) right.appendChild(el("div", "", "+" + (h.added || 0) + " −" + (h.removed || 0)));
    row.appendChild(right);
    return row;
  }

  function reportHeight() {
    var h = Math.ceil(root.getBoundingClientRect().height);
    if (h !== lastHeight) { lastHeight = h; post({ type: "resize", height: h }); }
  }

  function drawChrome() {
    document.getElementById("mute").innerHTML = muted ? ICON.soundOff : ICON.soundOn;
    document.getElementById("fold").innerHTML = collapsed ? ICON.down : ICON.up;
    var hb = document.getElementById("history");
    hb.innerHTML = ICON.clock; hb.className = showHistory ? "on" : "";
    document.getElementById("heading").textContent = showHistory ? "Today" : "Roster";
    root.className = collapsed ? "collapsed" : "";
  }

  window.huddleRender = function (items) {
    var sessions = [];
    (items || []).forEach(function (x) {
      if (x && x.kind === "history") history = x.items || [];
      else if (x && x.session_id) sessions.push(x);
    });
    // Keep sessions of one project next to each other, oldest project first.
    var firstSeen = {};
    sessions.forEach(function (s) {
      var p = s.project || "unknown";
      firstSeen[p] = Math.min(firstSeen[p] || Infinity, s.started || 0);
    });
    sessions.sort(function (a, b) {
      var pa = a.project || "unknown", pb = b.project || "unknown";
      if (pa !== pb) return firstSeen[pa] - firstSeen[pb] || (pa < pb ? -1 : 1);
      return (a.started || 0) - (b.started || 0);
    });
    lastSessions = sessions;

    // Sounds: a per-project chime when a session needs you, a pop when one finishes,
    // and a low note the first time a session goes quiet for too long.
    var seen = {}, chime = "";
    sessions.forEach(function (s) {
      var before = lastStatus[s.session_id];
      seen[s.session_id] = s.status;
      if (stalledFor(s)) {
        if (!stallChimed[s.session_id]) { stallChimed[s.session_id] = true; if (!firstRender && !chime) chime = "Basso"; }
      } else {
        stallChimed[s.session_id] = false;
      }
      if (firstRender || before === s.status) return;
      if (s.status === "waiting") chime = ASK_SOUNDS[hash(s.project || "") % ASK_SOUNDS.length];
      else if (s.status === "done" && before === "working" && !chime) chime = "Pop";
    });
    lastStatus = seen; firstRender = false;
    if (chime && !muted) post({ type: "sound", name: chime });

    var signature = JSON.stringify([showHistory, history.length, sessions.map(function (s) {
      return [s.session_id, s.project, s.branch, s.title, activityText(s), s.status, s.done, s.total, s.current,
              timeText(s), s.tokens, s.cost, s.files_n, s.added, s.removed,
              livePending(s) ? s.pending.id : "", !!replyOpen[s.session_id]];
    })]);
    if (signature === lastSignature) return;
    lastSignature = signature;

    var active = sessions.filter(function (s) { return s.status === "working" || s.status === "waiting"; }).length;
    document.getElementById("count").textContent = showHistory ? history.length : sessions.length;
    document.getElementById("dot").className = "dot" + (active ? "" : " off");

    list.textContent = "";
    if (showHistory) {
      if (!history.length) list.appendChild(el("div", "empty", "Nothing finished yet today."));
      var secs = 0, cost = 0;
      history.slice().reverse().forEach(function (h) { list.appendChild(historyRow(h)); secs += h.secs || 0; });
      if (history.length) list.appendChild(el("div", "total", history.length + " finished · " + duration(secs) + " of agent time"));
    } else {
      if (!sessions.length) list.appendChild(el("div", "empty", "No Claude Code sessions running."));
      var counts = {};
      sessions.forEach(function (s) { var p = s.project || "unknown"; counts[p] = (counts[p] || 0) + 1; });
      var current = null;
      sessions.forEach(function (s) {
        var p = s.project || "unknown";
        if (counts[p] > 1 && p !== current) {
          var g = el("div", "group");
          g.appendChild(el("span", "", p + " · " + counts[p] + " sessions"));
          g.appendChild(el("i"));
          list.appendChild(g);
        }
        current = p;
        list.appendChild(card(s));
      });
    }
    reportHeight();
  };

  // Ctrl+Option+A: allow the request that has been waiting longest.
  window.huddleHotkey = function (name) {
    if (name !== "allow") return;
    var waiting = lastSessions.filter(livePending).sort(function (a, b) {
      return (a.pending.created || 0) - (b.pending.created || 0);
    });
    if (!waiting.length) return;
    answered[waiting[0].pending.id] = true;
    post({ type: "allow", id: waiting[0].session_id });
    rerender();
  };

  document.getElementById("mute").addEventListener("click", function () {
    muted = !muted;
    try { localStorage.setItem("huddleMuted", muted ? "1" : "0"); } catch (e) {}
    drawChrome();
  });
  document.getElementById("fold").addEventListener("click", function () {
    collapsed = !collapsed; drawChrome(); reportHeight();
  });
  document.getElementById("history").addEventListener("click", function () {
    showHistory = !showHistory; collapsed = false; drawChrome(); rerender();
  });
  document.getElementById("hide").addEventListener("click", function () { post({ type: "hide" }); });

  // Drag the panel by its header.
  var drag = null;
  document.getElementById("header").addEventListener("mousedown", function (e) {
    if (e.target.closest("button")) return;
    drag = { x: e.screenX, y: e.screenY };
  });
  window.addEventListener("mousemove", function (e) {
    if (!drag) return;
    var dx = e.screenX - drag.x, dy = e.screenY - drag.y;
    if (dx || dy) { post({ type: "move", dx: dx, dy: dy }); drag = { x: e.screenX, y: e.screenY }; }
  });
  window.addEventListener("mouseup", function () {
    if (drag) { drag = null; post({ type: "moveEnd" }); }
  });

  drawChrome();
  window.huddleRender([]);

  // Open this file in a normal browser with ?demo (or ?demo&history) to preview the design.
  if (demo) {
    replyOpen["3"] = true; replyDraft["3"] = "";
    var t0 = Date.now() / 1000;
    window.huddleRender([
      { session_id: "1", project: "cpc-patient-lib", branch: "iron_version_2d_bp2auto", title: "Compare with the old BP algorithm", activity: "Allow? Read the BP2 monitor's scan timing", status: "waiting", done: 2, total: 5, current: "Reading timers", started: 1, demoTime: "waiting 2m", tokens: [42000, 18000, 90000, 1400000], cost: 3.42, files_n: 3, added: 120, removed: 34,
        pending: { id: "p1", tool: "Bash", can_always: true, summary: "Read the BP2 monitor's scan timing", detail: "cd app/src/main/java/com/cpcardio/cpc && sed -n '60,106p' Bp2Monitor.java | cut -c1-170" } },
      { session_id: "2", project: "cpc-patient-lib", branch: "bp-diag-log", title: "Add the connection log to bp_diag.csv", activity: "Editing SocketHandler.cpp", status: "working", done: 5, total: 7, current: "Wiring the log", started: 2, demoTime: "14m", tokens: [9000, 6000, 30000, 400000], cost: 0.86, files_n: 2, added: 48, removed: 6 },
      { session_id: "3", project: "cv-site", branch: "main", title: "Add dark mode toggle", activity: "Running: npm run build", status: "working", done: 0, total: 0, started: 3, demoTime: "9m", demoStall: 380, tokens: [3000, 2000, 8000, 90000], cost: 0.21 },
      { session_id: "4", project: "ADV", branch: "release/2.4", title: "Write release notes", activity: "Finished · waiting for you", status: "done", done: 3, total: 3, started: 4, demoTime: "done 6m ago", tokens: [2000, 4000, 5000, 60000], cost: 0.12, files_n: 1, added: 31, removed: 0 },
      { kind: "history", items: [
        { t: t0 - 5400, project: "cpc-patient-lib", branch: "bp-diag-log", title: "BP diagnostic log: bp_diag.csv on the phone", secs: 1260, files: 4, added: 210, removed: 18 },
        { t: t0 - 3000, project: "cv-site", branch: "main", title: "Fix the mobile header overlap", secs: 340, files: 2, added: 22, removed: 9 },
        { t: t0 - 360, project: "ADV", branch: "release/2.4", title: "Write release notes", secs: 185, files: 1, added: 31, removed: 0 }
      ] }
    ]);
  }
})();
</script>
